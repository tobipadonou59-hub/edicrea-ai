<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Création graphique, mise en page et édition assistées par IA : livres, couvertures, affiches." />
    <meta name="theme-color" content="#13161a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="EDICREA" />
    <title>EDICREA AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;700;900&family=Montserrat:wght@400;700;900&family=Lora:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;700&family=Bebas+Neue&family=Merriweather:wght@400;700&family=Poppins:wght@400;600;800&family=Abril+Fatface&family=Dancing+Script:wght@700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,500&family=Cinzel:wght@400;700;900&family=Bodoni+Moda:wght@400;700;900&family=DM+Serif+Display&family=Libre+Baskerville:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Raleway:wght@300;400;700;900&family=Anton&family=Archivo+Black&family=Righteous&family=Space+Grotesk:wght@400;700&family=Great+Vibes&family=Sacramento&display=swap" rel="stylesheet" />
    <style>
      /* Écran d'ouverture EDICREA AI (logo « Coup de pinceau ») — affiché avant le chargement de l'application */
      #splash { position: fixed; inset: 0; z-index: 9999; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0b0c10; transition: opacity .8s cubic-bezier(.4,0,.2,1), visibility .8s; cursor: pointer; -webkit-font-smoothing: antialiased }
      #splash.out { opacity: 0; visibility: hidden }
      #splash .glow { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0; animation: sp-glow 3s ease-out .2s forwards }
      #splash .g1 { width: 70vmax; height: 70vmax; left: -28vmax; top: -30vmax; background: #ff7a59; --o: .38 }
      #splash .g2 { width: 75vmax; height: 75vmax; right: -32vmax; bottom: -34vmax; background: #6c3fc4; --o: .42 }
      #splash .g3 { width: 40vmax; height: 40vmax; left: 50%; top: 50%; margin: -20vmax 0 0 -20vmax; background: #d6406f; --o: .16; animation-delay: 1.2s }
      #splash .mark { position: relative; width: min(34vw, 156px); aspect-ratio: 1; opacity: 0; transform: scale(.55) rotate(-10deg);
        animation: sp-pop 1.5s cubic-bezier(.2,1.25,.3,1) .5s forwards; filter: drop-shadow(0 22px 44px rgba(214,64,111,.42)) }
      #splash .mark svg { width: 100%; height: 100%; display: block; overflow: visible }
      #splash .reveal { stroke-dasharray: 1; stroke-dashoffset: 1; animation: sp-draw 1.9s cubic-bezier(.65,0,.35,1) 1.4s forwards }
      #splash .spark { transform-box: fill-box; transform-origin: center; opacity: 0; transform: scale(0) rotate(-120deg);
        animation: sp-spark 1s cubic-bezier(.2,1.5,.35,1) 3.05s forwards, sp-twinkle 3s ease-in-out 4.1s infinite }
      #splash .sheen { position: absolute; inset: 0; border-radius: 23%; overflow: hidden; pointer-events: none }
      #splash .sheen::after { content: ""; position: absolute; top: -20%; bottom: -20%; width: 40%; left: -60%;
        background: linear-gradient(100deg, transparent, rgba(255,255,255,.75), transparent); transform: skewX(-18deg); animation: sp-sheen 1.4s ease-in-out 3.6s forwards }
      #splash .word { display: flex; margin-top: 34px; font: 800 clamp(26px, 7vw, 40px)/1 Inter, system-ui, -apple-system, sans-serif; letter-spacing: .14em; color: #f3f1ec; padding-left: .14em }
      #splash .word span { display: inline-block; opacity: 0; transform: translateY(18px); filter: blur(6px); animation: sp-letter .9s cubic-bezier(.2,.8,.2,1) forwards }
      #splash .word .ai { background: linear-gradient(100deg, #ff7a59, #d6406f 55%, #8b5cf6); -webkit-background-clip: text; background-clip: text; color: transparent }
      #splash .tag { margin-top: 16px; font: 600 clamp(10px, 2.6vw, 12px)/1 Inter, system-ui, sans-serif; letter-spacing: .32em; text-transform: uppercase; color: #dcb56f; padding-left: .32em;
        opacity: 0; transform: translateY(8px); animation: sp-in 1s ease 4.7s forwards }
      #splash .start { margin-top: 54px; display: inline-flex; align-items: center; gap: 10px; padding: 13px 26px; border-radius: 999px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.05);
        font: 600 clamp(13px, 3.6vw, 15px)/1 Inter, system-ui, sans-serif; letter-spacing: .04em; color: #f3f1ec; opacity: 0; transform: translateY(10px);
        animation: sp-in .9s ease 5.4s forwards, sp-breathe 2.4s ease-in-out 6.4s infinite; -webkit-tap-highlight-color: transparent }
      #splash .start::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: linear-gradient(135deg, #ff7a59, #d6406f); box-shadow: 0 0 12px #d6406f }
      #splash .bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 0 max(26px, calc(env(safe-area-inset-bottom) + 14px)); display: flex; flex-direction: column; align-items: center; gap: 12px; opacity: 0; animation: sp-in 1s ease 5.8s forwards }
      #splash .bar .line { width: 132px; height: 2px; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden }
      #splash .bar .line i { display: block; height: 100%; width: 38%; background: linear-gradient(90deg, transparent, #d6406f, #ff7a59, transparent); animation: sp-load 2.2s ease-in-out infinite }
      #splash .bar .by { font: 500 12px/1 Inter, system-ui, sans-serif; letter-spacing: .14em; color: rgba(243,241,236,.55) }
      #splash .bar .by b { font-weight: 600; color: #dcb56f; letter-spacing: .1em }
      @keyframes sp-breathe { 0%, 100% { opacity: 1; border-color: rgba(255,255,255,.16) } 50% { opacity: .62; border-color: rgba(214,64,111,.55) } }
      @keyframes sp-glow { to { opacity: var(--o) } }
      @keyframes sp-pop { 60% { opacity: 1 } to { opacity: 1; transform: none } }
      @keyframes sp-draw { to { stroke-dashoffset: 0 } }
      @keyframes sp-spark { to { opacity: 1; transform: none } }
      @keyframes sp-twinkle { 0%, 100% { transform: scale(1) rotate(0) } 50% { transform: scale(1.18) rotate(18deg) } }
      @keyframes sp-sheen { to { left: 130% } }
      @keyframes sp-letter { to { opacity: 1; transform: none; filter: none } }
      @keyframes sp-in { to { opacity: 1; transform: none } }
      @keyframes sp-load { from { transform: translateX(-110%) } to { transform: translateX(270%) } }
      @media (prefers-reduced-motion: reduce) { #splash *, #splash *::after { animation-duration: .01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important } }
    </style>
  </head>
  <body>
    <div id="splash" role="img" aria-label="EDICREA AI">
      <div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
      <div class="mark">
        <svg viewBox="0 0 512 512" aria-hidden="true">
          <defs>
            <linearGradient id="sp-brush" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ff7a59"/><stop offset=".5" stop-color="#d6406f"/><stop offset="1" stop-color="#6c3fc4"/></linearGradient>
            <mask id="sp-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
              <path class="reveal" pathLength="1" d="M 40 420 C 120 380 160 300 240 230 S 360 140 430 110" fill="none" stroke="#fff" stroke-width="190" stroke-linecap="round"/>
            </mask>
          </defs>
          <rect width="512" height="512" rx="116" fill="#fbf7f0"/>
          <g mask="url(#sp-mask)">
            <path d="M110 360c40-120 150-210 290-230-60 40-96 90-110 150-14 62-80 112-180 80z" fill="url(#sp-brush)"/>
            <path d="M112 362c-12 24-30 38-54 44 22 8 52 6 74-12" fill="#3a1d5c"/>
          </g>
          <path class="spark" d="M384 300l12 32 32 12-32 12-12 32-12-32-32-12 32-12z" fill="#dcb56f"/>
        </svg>
        <div class="sheen"></div>
      </div>
      <div class="word"><span style="animation-delay:3.30s">E</span><span style="animation-delay:3.39s">D</span><span style="animation-delay:3.48s">I</span><span style="animation-delay:3.57s">C</span><span style="animation-delay:3.66s">R</span><span style="animation-delay:3.75s">E</span><span style="animation-delay:3.84s">A</span><span style="animation-delay:4.05s">&nbsp;</span><span class="ai" style="animation-delay:4.14s">A</span><span class="ai" style="animation-delay:4.23s">I</span></div>
      <div class="tag">Studio de création &amp; d’édition · IA</div>
      <div class="start">Appuyez pour commencer</div>
      <div class="bar"><div class="line"><i></i></div><div class="by">by <b>Oluwatobi</b></div></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
